name: Canvas MCP Tests

on:
  push:
    paths:
      - "canvas-mcp/**"
      - ".github/workflows/canvas-mcp-tests.yml"
      - "README.md"
  pull_request:
    paths:
      - "canvas-mcp/**"
      - ".github/workflows/canvas-mcp-tests.yml"
      - "README.md"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    defaults:
      run:
        working-directory: canvas-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q
